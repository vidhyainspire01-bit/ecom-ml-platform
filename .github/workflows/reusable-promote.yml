name: reusable-promote
# FLOW 1 — DS handoff promotion. Loads the model DS already registered,
# re-scores it independently, re-tags the stage if it passes, deploys
# to that stage's endpoint.
#
# GATED APPROVAL: the job's `environment:` is set to whatever stage is
# being promoted to. A GitHub Environment named "production" with
# required reviewers configured will PAUSE this job until approved.

on:
  workflow_call:
    inputs:
      model_name:
        required: true
        type: string
      target_stage:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID: { required: true }
      AZURE_TENANT_ID: { required: true }
      AZURE_SUBSCRIPTION_ID: { required: true }

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_stage }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add -n ml -y
      - run: az configure --defaults group=ecom-mlops-rg workspace=ecom-mlops-ws
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install "mlflow==2.14.1" "mlflow-skinny==2.14.1" "azureml-mlflow==1.57.0" scikit-learn pandas pyyaml requests
      - name: Point MLflow at the Azure ML workspace
        run: |
          echo "MLFLOW_TRACKING_URI=$(az ml workspace show --query mlflow_tracking_uri -o tsv)" >> $GITHUB_ENV
      - name: Download the platform's held-out validation set
        run: |
          mkdir -p validation_data
          az storage blob download \
            --account-name ecommlopstorageaaf1d8da7 \
            --container-name azureml-blobstore-fd2efc89-0d50-4333-801f-e697c5bdd4b7 \
            --name "validation-sets/${{ inputs.model_name }}/validation.csv" \
            --file validation_data/validation.csv \
            --auth-mode login
      - name: Show what actually got downloaded
        run: find validation_data -type f
      - run: |
          python mlops/validate_and_promote.py \
            --model_name "${{ inputs.model_name }}" \
            --validation_data "$(find validation_data -name '*.csv' | head -1)" \
            --target_stage "${{ inputs.target_stage }}"
      - name: Deploy the just-promoted model version to the target endpoint
        run: |
          MODEL_NAME=$(python -c "import yaml; print(yaml.safe_load(open('mlops/models/${{ inputs.model_name }}/promotion_config.yml'))['registered_model_name'])")
          MODEL_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('mlops/models/${{ inputs.model_name }}/promotion_config.yml'))['registered_model_version'])")
          chmod +x mlops/scripts/deploy_model.sh
          ./mlops/scripts/deploy_model.sh "${{ inputs.target_stage }}" "$MODEL_NAME" "$MODEL_VERSION" "${{ inputs.model_name }}"