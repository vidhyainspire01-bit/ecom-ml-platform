name: reusable-train
# FLOW 2 — platform-owned retraining. Trains from scratch via the
# shared components. Independent of any DS handoff.

on:
  workflow_call:
    inputs:
      model_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID: { required: true }
      AZURE_TENANT_ID: { required: true }
      AZURE_SUBSCRIPTION_ID: { required: true }

jobs:
  train-evaluate-register:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add -n ml -y
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install pyyaml
      - run: |
          chmod +x mlops/scripts/submit_pipeline.sh
          ./mlops/scripts/submit_pipeline.sh "${{ inputs.model_name }}" "${{ github.sha }}" "v1"
